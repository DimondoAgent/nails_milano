<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MÆLE SOURCE{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    {% block head %}{% endblock %}

    <style>
        /* Плавный fade через opacity на body — не блокирует навигацию */
        body {
            animation: fadeIn 0.3s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .lang-toggle {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 20px;
            padding: 3px;
            gap: 2px;
            flex-shrink: 0;
        }
        .lang-pill {
            font-family: 'Manrope', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 1.5px;
            font-weight: 600;
            color: #888;
            background: transparent;
            border: none;
            padding: 5px 11px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            line-height: 1;
        }
        .lang-pill.active {
            background: #ffffff;
            color: #0a0a0a;
        }
        .lang-pill:hover:not(.active) {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <header class="header">
        <nav class="navbar container">
            <a href="{{ url_for('index') }}" class="nav-logo">MÆLE SOURCE</a>

            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div class="nav-links-wrapper" id="nav-links">
                <div class="nav-left">
                    <a href="{{ url_for('gallery') }}" data-i18n="nav_collection">Collection</a>
                    <a href="{{ url_for('services') }}" data-i18n="nav_partners">Partners</a>
                </div>

                <div class="nav-right">
                    <a href="{{ url_for('profile') }}" data-i18n="nav_about">About</a>
                    <a href="{{ url_for('booking') }}" class="btn-book-nav" data-i18n="nav_reviews">Reviews</a>

                    <div class="lang-toggle">
                        <button class="lang-pill" id="pill-en" onclick="setLang('en')">EN</button>
                        <button class="lang-pill" id="pill-ru" onclick="setLang('ru')">RU</button>
                        <button class="lang-pill" id="pill-it" onclick="setLang('it')">IT</button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main id="mainContent">
        {% block content %}{% endblock %}
    </main>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 600, once: true });
    </script>

    <script>
        // =============================================
        // ПЛАВНЫЙ ПЕРЕХОД — fade out перед уходом
        // =============================================
        document.addEventListener('click', (e) => {
            const link = e.target.closest('a');
            if (!link) return;

            const href = link.getAttribute('href');
            if (!href || !href.startsWith('/') || href.startsWith('//')) return;
            if (href.includes('logout')) return;

            e.preventDefault();

            // Плавно скрываем страницу
            document.body.style.transition = 'opacity 0.2s ease';
            document.body.style.opacity = '0';

            setTimeout(() => {
                window.location.href = href;
            }, 200);
        });


        // =============================================
        // ПЕРЕВОДЫ
        // =============================================
        const TRANSLATIONS = {
            en: {
                nav_collection: 'Collection',
                nav_partners: 'Partners',
                nav_about: 'About',
                nav_reviews: 'Reviews',
            },
            ru: {
                nav_collection: 'Коллекция',
                nav_partners: 'Партнёры',
                nav_about: 'О нас',
                nav_reviews: 'Отзывы',
            },
            it: {
                nav_collection: 'Collezione',
                nav_partners: 'Partner',
                nav_about: 'Chi siamo',
                nav_reviews: 'Recensioni',
            }
        };

        function setLang(lang) {
            localStorage.setItem('siteLang', lang);
            applyTranslations(lang);
            updateLangUI(lang);
        }

        function applyTranslations(lang) {
            const t = TRANSLATIONS[lang] || TRANSLATIONS['en'];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });
        }

        function updateLangUI(lang) {
            ['en', 'ru', 'it'].forEach(l => {
                const pill = document.getElementById('pill-' + l);
                if (pill) pill.classList.toggle('active', l === lang);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('siteLang') || 'en';
            applyTranslations(saved);
            updateLangUI(saved);
        });


        // =============================================
        // БУРГЕР-МЕНЮ
        // =============================================
        (function () {
            const hamburger = document.getElementById('hamburger');
            const navLinks  = document.getElementById('nav-links');
            const menuLinks = document.querySelectorAll('.nav-links-wrapper a');

            if (!hamburger || !navLinks) return;

            hamburger.addEventListener('click', () => {
                hamburger.classList.toggle('active');
                navLinks.classList.toggle('active');
                document.body.classList.toggle('no-scroll');
            });

            menuLinks.forEach(link => {
                link.addEventListener('click', () => {
                    hamburger.classList.remove('active');
                    navLinks.classList.remove('active');
                    document.body.classList.remove('no-scroll');
                });
            });
        })();
    </script>

</body>
</html>
